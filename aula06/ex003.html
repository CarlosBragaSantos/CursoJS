<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programa!</title>
    <style>
        body{
            background-color: rgb(51, 51, 133); /* Comentário em CSS */
            color: white;
            font: normal 20pt arial;
        }
        h1{
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Ola Mundo!</h1> <!-- Comentario em HTML -->
    <p>Já me livrei da maldição......</p>

    <script>
       var n1 = Number(window.prompt('Digite um número?'))
       var n2 = Number(window.prompt('Digite mais um número'))
       var s = n1 + n2
       window.alert(`A soma entre ${n1} mais ${n2} é ${s}`)

       // number + number = + serve para adição
       // string + string = + serve tambem para concatenação 

    </script>
</body>
</html>
